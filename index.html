<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">
  <title>משחק טריוויה</title>
  <style>
    body { 
      font-family: "Segoe UI", Arial, sans-serif; 
      direction: rtl; 
      text-align: center; 
      background: linear-gradient(to bottom, #2196f3, #bbdefb);
      color: #333;
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    h1 {
      margin-bottom: 20px;
      color: #fff;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.4);
    }
    #progress-container {
      width: 80%;
      background: #e0e0e0;
      border-radius: 10px;
      margin: 10px auto 20px;
      height: 20px;
      overflow: hidden;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
    }
    #progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(to right, #4caf50, #81c784);
      transition: width 0.5s ease;
    }
    .question {
      font-size: 22px; 
      margin: 20px 0;
      font-weight: bold;
      color: #212121;
    }
    .option {
      display: block;
      margin: 10px auto;
      padding: 12px 20px;
      width: 250px;
      border: none;
      border-radius: 10px;
      background: #fff;
      cursor: pointer;
      transition: 0.3s;
      font-size: 16px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    .option:hover { background: #e3f2fd; }
    .correct { background: #4caf50 !important; color: #fff; }
    .wrong { background: #f44336 !important; color: #fff; }
    .summary {
      font-size: 20px;
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h1>🎉 משחק טריוויה 🎉</h1>
  
  <!-- Progress bar -->
  <div id="progress-container">
    <div id="progress-bar"></div>
  </div>

  <div id="quiz"></div>
  
  <script src="questions.js"></script>
  <script src="script.js"></script>
</body>
</html>
