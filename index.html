<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> טריוויה מבחנים</title>
  <link rel="stylesheet" href="style.css">

  <!-- קוד כללי של המשחק -->
  <script src="script.js" defer></script>

  <!-- קבצי המבחנים (כל קובץ = מבחן) -->
  <!-- <script src="exams/raf0.js" defer></script>
  <script src="exams/maoz.js" defer></script>
  <script src="exams/mivhan_saf.js" defer></script>
  <script src="exams/brosh.js" defer></script>
  <script src="exams/brosh_gdud.js" defer></script>
  <script src="exams/mikratot_pdf.js" defer></script>
  <script src="exams/mechin_maoz.js" defer></script>
  <script src="exams/new_test.js" defer></script> -->

  <script src="exams/middle.js" defer></script>

  <!-- בעתיד: פשוט להוסיף כאן עוד שורה לכל מבחן חדש -->
</head>
<body>
  <div id="container">
    <!-- מסך בחירת מבחן -->
    <div id="examSelect" class="card fade-in">
      <h1>בחר/י מבחן</h1>
      <p style="text-align:center">בחר/י איזה מבחן לשחק:</p>
      <div id="examButtons" class="exam-buttons"></div>
    </div>

    <!-- תפריט פרקים (רלוונטי רק למבחנים שמחולקים לפרקים, כמו רף 0) -->
    <div id="menu" class="card hidden fade-in">
      <h1 id="examTitle">טריוויה לפי פרקים</h1>
      <p style="text-align:center">
        בחר/י פרק לשחק עליו, או שחק/י על כל הפרקים יחד:
      </p>
      <label style="display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:10px;">
        <input type="checkbox" id="shuffleQuestions"> ערבב שאלות בכל משחק
      </label>
      <div id="chapters"></div>
      <button id="allBtn">🎯 שחק מכל הפרקים</button>
      <button id="backToExamSelect" class="exit">⬅️ חזרה לבחירת מבחן</button>
    </div>

    <!-- משחק -->
    <div id="game" class="card hidden fade-in">
      <h2 id="chapterName"></h2>
      <p id="progress"></p>
      <div id="questionBox" class="fade-slide">
        <h3 id="questionText"></h3>
        <div id="options" class="options"></div>
        <div id="feedback"></div>
        <div style="display:flex;gap:10px;flex-direction:column;">
          <button id="submitBtn">בדוק תשובה ▶</button>
          <button id="exitBtn" class="exit">🔚 סיים טריוויה</button>
        </div>
      </div>
    </div>

    <!-- סיכום -->
    <div id="summary" class="card hidden fade-in">
      <h2>סיום!</h2>
      <p id="scoreText"></p>
      <button id="againBtn">שחק שוב</button>
      <button id="menuBtn">חזרה לתפריט</button>
    </div>
  </div>
</body>
</html>
