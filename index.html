<div id="app">
  <h1>משחק טריוויה</h1>

  <!-- Progress Bar -->
  <div id="progress-container">
    <div id="progress-bar"></div>
  </div>

  <div id="quiz">
    <div id="question"></div>
    <div class="answers" id="answers"></div>
    <button id="next" class="normal">הבא</button>
  </div>

  <div id="result" style="display:none;">
    <h2>סיכום המשחק</h2>
    <p id="score"></p>
    <table id="wrong-answers">
      <thead>
        <tr>
          <th>שאלה</th>
          <th>תשובתך</th>
          <th>תשובה נכונה</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <button id="play-again" class="normal">שחק שוב</button>
  </div>
</div>
