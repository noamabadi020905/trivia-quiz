<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>טריוויה בעברית</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="menu">
    <h1>ברוכים הבאים לטריוויה הכי טובה בעולם!</h1>
    <div id="parts-buttons"></div>
    <button id="all-parts-btn">טריוויה מכל החלקים</button>
  </div>

  <div id="quiz" style="display:none;">

    <div id="options"></div>

  <div id="summary" style="display:none;">
    <h2>סיום הטריוויה!</h2>
    <div id="wrong-answers"></div>
    <button id="play-again-btn">שחק שוב</button>
  </div>

  <script src="questions.js"></script>
  <script src="script.js"></script>
</body>
</html>
