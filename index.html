<body>
  <div id="container">
    <!-- מסך בחירת מבחן -->
    <div id="examSelect" class="card fade-in">
      <h1>בחירת מבחן</h1>
      <p style="text-align:center">בחר/י סוג מבחן:</p>
      <button data-exam="raf0">📚 מבחן רף 0</button>
      <button data-exam="maoz">🛡️ מבחן מעוז</button>
    </div>

    <!-- תפריט פרקים (רלוונטי למבחן רף 0) -->
    <div id="menu" class="card hidden fade-in">
      <h1>טריוויה לפי פרקים</h1>
      <p style="text-align:center">בחר/י פרק לשחק עליו, או שחק/י על כל הפרקים יחד:</p>
      <label style="display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:10px;">
        <input type="checkbox" id="shuffleQuestions"> ערבב שאלות בכל משחק
      </label>
      <div id="chapters"></div>
      <button id="allBtn">🎯 שחק מכל הפרקים</button>
      <button id="backToExamSelect" class="exit">⬅️ חזרה לבחירת מבחן</button>
    </div>

    <!-- משחק -->
    <div id="game" class="card hidden fade-in">
      <h2 id="chapterName"></h2>
      <p id="progress"></p>
      <div id="questionBox" class="fade-slide">
        <h3 id="questionText"></h3>
        <div id="options" class="options"></div>
        <div id="feedback"></div>
        <div style="display:flex;gap:10px;flex-direction:column;">
          <button id="submitBtn">בדוק תשובה ▶</button>
          <button id="exitBtn" class="exit">🔚 סיים טריוויה</button>
        </div>
      </div>
    </div>

    <!-- סיכום -->
    <div id="summary" class="card hidden fade-in">
      <h2>סיום!</h2>
      <p id="scoreText"></p>
      <button id="againBtn">שחק שוב</button>
      <button id="menuBtn">חזרה לתפריט</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
